org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.log.com.example=info
# Logs every Entra ID token acquisition, e.g. "Azure Identity => getToken() result for scopes [...]: SUCCESS"
org.slf4j.simpleLogger.log.com.azure.identity=info
org.slf4j.simpleLogger.log.com.azure.identity.extensions=warn
org.slf4j.simpleLogger.log.com.zaxxer.hikari=info
